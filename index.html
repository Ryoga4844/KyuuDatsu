<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no">
    <meta name="theme-color" content="#231F20">
    <meta name="description" content="Play 脱獄ごっこ in Unity WebGL.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Unity Web Player | 脱獄ごっこ</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-mobile">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">脱獄ごっこ</div>
      </div>
    </div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./ServiceWorker.js").catch(function () {});
        });
      }

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      function getViewportWidth() {
        var viewport = window.visualViewport;
        var root = document.documentElement;
        var candidates = [
          window.innerWidth || 0,
          root ? root.clientWidth : 0,
          viewport ? viewport.width : 0
        ];

        if (document.fullscreenElement || window.innerWidth > window.innerHeight) {
          candidates.push(window.screen ? window.screen.width : 0);
          candidates.push(window.screen ? window.screen.height : 0);
        }

        return Math.max(1, Math.floor(Math.max.apply(null, candidates)));
      }

      function resizeUnityCanvas() {
        var width = getViewportWidth();

        document.documentElement.style.setProperty("--app-width", width + "px");
        document.body.style.width = width + "px";
        document.body.style.minWidth = width + "px";
        container.style.width = width + "px";
        container.style.minWidth = width + "px";
        canvas.style.width = "100%";
        window.scrollTo(0, 0);
      }

      window.addEventListener("resize", resizeUnityCanvas, { passive: true });
      window.addEventListener("orientationchange", function () {
        setTimeout(resizeUnityCanvas, 100);
        setTimeout(resizeUnityCanvas, 500);
      }, { passive: true });
      document.addEventListener("fullscreenchange", function () {
        setTimeout(resizeUnityCanvas, 50);
        setTimeout(resizeUnityCanvas, 300);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeUnityCanvas, { passive: true });
        window.visualViewport.addEventListener("scroll", resizeUnityCanvas, { passive: true });
      }

      canvas.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      });

      resizeUnityCanvas();

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLBuild.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGLBuild.data",
        frameworkUrl: buildUrl + "/WebGLBuild.framework.js",
        codeUrl: buildUrl + "/WebGLBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ryoga4844",
        productName: "脱獄ごっこ",
        productVersion: "1.0.0",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          resizeUnityCanvas();
          var resizeInterval = setInterval(resizeUnityCanvas, 250);
          setTimeout(function () { clearInterval(resizeInterval); }, 3000);

          var fullscreenButton = document.querySelector("#unity-fullscreen-button");
          if (fullscreenButton != null) {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }

        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
