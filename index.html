<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#231F20">
    <meta name="description" content="Play 脱獄ごっこ in Unity WebGL.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Unity Web Player | 脱獄ごっこ</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-mobile">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">脱獄ごっこ</div>
      </div>
    </div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./ServiceWorker.js").catch(function () {});
        });
      }

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      function getViewportSize() {
        var viewport = window.visualViewport;
        return {
          width: Math.max(1, Math.floor(viewport ? viewport.width : window.innerWidth)),
          height: Math.max(1, Math.floor(viewport ? viewport.height : window.innerHeight))
        };
      }

      function resizeUnityCanvas() {
        var size = getViewportSize();
        var maxDevicePixelRatio = isMobile ? 1.5 : 2;
        var devicePixelRatio = Math.min(window.devicePixelRatio || 1, maxDevicePixelRatio);
        var renderWidth = Math.max(1, Math.floor(size.width * devicePixelRatio));
        var renderHeight = Math.max(1, Math.floor(size.height * devicePixelRatio));

        document.documentElement.style.setProperty("--app-height", size.height + "px");
        container.style.width = size.width + "px";
        container.style.height = size.height + "px";
        canvas.style.width = size.width + "px";
        canvas.style.height = size.height + "px";

        if (canvas.width !== renderWidth || canvas.height !== renderHeight) {
          canvas.width = renderWidth;
          canvas.height = renderHeight;
        }
      }

      window.addEventListener("resize", resizeUnityCanvas, { passive: true });
      window.addEventListener("orientationchange", function () {
        setTimeout(resizeUnityCanvas, 100);
        setTimeout(resizeUnityCanvas, 500);
      }, { passive: true });

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeUnityCanvas, { passive: true });
        window.visualViewport.addEventListener("scroll", resizeUnityCanvas, { passive: true });
      }

      canvas.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      });

      resizeUnityCanvas();

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLBuild.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGLBuild.data",
        frameworkUrl: buildUrl + "/WebGLBuild.framework.js",
        codeUrl: buildUrl + "/WebGLBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ryoga4844",
        productName: "脱獄ごっこ",
        productVersion: "1.0.0",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          resizeUnityCanvas();
          var resizeInterval = setInterval(resizeUnityCanvas, 250);
          setTimeout(function () { clearInterval(resizeInterval); }, 3000);

          var fullscreenButton = document.querySelector("#unity-fullscreen-button");
          if (fullscreenButton != null) {
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }

        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
